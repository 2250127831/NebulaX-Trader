name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ liburing-dev libyaml-cpp-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run unit tests
        # -LE ci-skip: 跳过环境敏感集成测试(ut_benchmark_verify, GitHub runner 上卡死)
        # --timeout 120: 任一测试卡死 120s 超时失败暴露, 不无限挂 CI
        run: ctest --test-dir build --output-on-failure -LE ci-skip --timeout 120

      - name: Build (AddressSanitizer)
        run: |
          cmake -B build_asan -DCMAKE_BUILD_TYPE=Debug -DSANITIZE_ADDRESS=ON
          cmake --build build_asan -j$(nproc)
          ctest --test-dir build_asan --output-on-failure -LE ci-skip --timeout 120
