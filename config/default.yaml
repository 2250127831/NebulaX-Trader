# NebulaX-Trader 全局配置

market:
  # 行情数据源类型
  # itch : NASDAQ ITCH 协议接入（回放）
  type: itch

  # UDP 行情源连接参数
  host: "127.0.0.1"
  port: 8080

  # io_uring 异步 IO 配置
  uring_entries: 256

  # 字节 ring 容量（接收 → 解析）
  ring_bytes: 4194304

  # 通道 A/B 槽位数
  chan_slots: 1048576

  # 多解析器线程数（V2.3: 单 parse_th → N 个解析器并行）
  parse_workers: 2

order_book:
  # 是否启用订单簿重建（通道B）+ OBI/OFI 策略
  enabled: true

  # 共享挂单池槽位
  pool_slots: 1048576

  # 分簿并行 book_worker 数（广播 + skip，V2.1）
  workers: 4

strategy:
  # 主策略（定方向）
  # volume_breakout : 成交量突破
  # trend           : 趋势跟踪（需多根K线）
  # momentum        : 动量（需多根K线）
  primary: volume_breakout

  # 成交量突破参数
  vol_window: 100
  vol_threshold: 5000

  # 从策略（定强度）
  use_obi: true
  use_ofi: true

  # 低频主策略的 K线聚合（每 N 笔成交一根，与时间无关）
  kline_ticks: 10

risk:
  # 单品种最大持仓
  max_position: 10000

  # 单日最大亏损（分，默认 100 万元）
  max_daily_loss: 100000000

execution:
  # 满强度基准下单量（股）
  base_qty: 100

  # 模拟交易所收单端口
  order_port: 9090

  # 成交回报接收端口
  order_ret_port: 9091

  # 行情停止增长后退出等待秒数（回放数据发完即停）
  # 压测脚本用 --no-shm: 无消息超过该秒数 → 写解析总数到文件 → 自动关闭
  idle_timeout_sec: 10
