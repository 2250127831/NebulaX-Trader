# NebulaX-Trader 全局配置

market:
  # 行情数据源类型
  # itch : NASDAQ ITCH 协议接入（回放）
  type: itch

  # UDP 行情源连接参数
  host: "127.0.0.1"
  port: 8080

  # 网络接收后端: io_uring(默认) / af_xdp / dpdk
  #   io_uring: UDP socket(内核剥头, 本地回环/真实网卡通用)
  #   af_xdp  : 绑 ifname 接口, 收完整 L2 帧(与真实网卡一致)后内部剥帧头
  #             本地正确性需 veth 对(veth0 挂 XDP+xsk); 真实网卡需支持 XDP DRV_MODE
  #   dpdk    : vdev 软件 PMD(如 net_tap0)/物理 PMD, 收完整 L2 帧后内部剥帧头
  #             本地正确性用 net_tap(vdev 建内核 tap dtap0); 真实网卡需有 DPDK PMD
  backend: io_uring
  # af_xdp: 绑定接口(如 veth0 / enp4s0)
  ifname: ""
  # dpdk: vdev 规格(如 net_tap0 → 内核 tap dtap0)
  vdev: ""
  # dpdk: EAL 参数(本地 net_tap 需 --no-pci --no-huge; 真实网卡用 --pci <addr>)
  eal_args: ["-l", "0", "--no-pci", "--no-huge", "-m", "128", "--file-prefix", "nxtrader"]

  # io_uring 异步 IO 配置
  uring_entries: 256

  # 字节 ring 容量（接收 → 解析）
  ring_bytes: 4194304

  # 通道 A/B 槽位数
  chan_slots: 1048576

order_book:
  # 是否启用订单簿重建（通道B）+ OBI/OFI 策略
  enabled: true

  # 共享挂单池槽位
  pool_slots: 1048576

  # 分簿并行 book_worker 数（广播 + skip，V2.1）
  workers: 4

strategy:
  # 启用的策略组合（编译期绑定, 启动期固定; 按序对应槽）
  # 支持: ofi（订单流失衡） / obi（盘口失衡）; 空列表 = 仅收行情不交易
  strategies: [ofi, obi]

  # 主策略（须在 strategies 中; 决定下单标的/seq, 不单独定方向）
  primary: ofi

  # 各策略投票权重（加权净投票定方向; 未列缺省 1.0）
  weights: {ofi: 1.0, obi: 0.6}

  # 净投票阈值: 净信号 > 阈值→买, < -阈值→卖, 区间内观望。0 = 任一策略有信号即下（宽松）
  vote_threshold: 0.0

  # 成交量突破参数（volume_breakout 接入白名单时启用）
  vol_window: 100
  vol_threshold: 5000

  # K线策略参数（kline 策略接入白名单时启用, 每 N 笔成交一根, 与时间无关）
  kline_ticks: 10

risk:
  # 单品种最大持仓
  max_position: 10000

  # 单日最大亏损（分，默认 100 万元）
  max_daily_loss: 100000000

  # 盯市回撤风控（V5）
  # 初始资金（分），净值基准 = 初始 + 已实现 + Σ(持仓×(现价-成本))
  initial_equity: 100000000

  # 回撤第一档：破档暂停新单（分，相对净值峰值）
  max_drawdown_pause: 5000000

  # 回撤第二档：破档强制平仓（撤全部活单）（分）
  max_drawdown_flatten: 10000000

execution:
  # 满强度基准下单量（股）
  base_qty: 100

  # 模拟交易所收单端口
  order_port: 9090

  # 成交回报接收端口
  order_ret_port: 9091

  # 行情停止增长后退出等待秒数（回放数据发完即停）
  # 压测脚本用 --no-shm: 无消息超过该秒数 → 写解析总数到文件 → 自动关闭
  idle_timeout_sec: 10
