# NebulaX-Trader 延迟追踪配置 — 完整链路(V3 分发器版)
# 探针位置见 core/prof/lensx_probe.h。
#
# 四级测量(V3 分发器后):
#  级别1 包级 recv_th 内部延迟(seq 模式, 同线程, 无 key)
#     recv_pkt → unpack    IoUringReceiver::recv 返回 → MoldUdpUnpacker::feed 拆包开始
#     测: 包到达 → 开始拆包。recv 每包 1 次, feed 每包 1 次, 1:1 seq 配对。
#  级别2 消息级完整链路(key 模式, 跨线程, key = 消息 seq, 抽样 1/128)
#     alloc → process      分配 seq → 被归属 worker 开始处理
#     测: 一条消息从分配到被处理的完整旅程(含跨线程排队)。
#     V3 分发器语义: 解析器按 locate 分发到 N 条 SPSC(满进 retry 桶), worker 只 pop
#     自己的。dispatch→pop = 分发到 spsc[owner]→worker 取走(排队主段),
#     pop→process = 取走到处理(同线程, 应极小, 证明长尾在排队不在处理)。
#     retry 路径(慢消费者隔离触发时): dispatch→retry_in = 进桶(满/active),
#     retry_in→retry_out = 桶→retry 推回 spsc, retry_out→pop = 推回→worker 取走。
#     抽样: msg_seq % kSample == 0 才打, 避免拖垮高频线程(全采样实测吞吐 5M→543K)。
#  级别3 仲裁函数完整执行耗时(seq 模式, 同线程, 无 key, 抽样 1/128)
#     arb_start → arb_end  arbitrate 开头 → 统一出口。arbitrate 单出口, 成对无残留。
#  级别4 下单决策→执行完毕(key 模式, key = sig_ofi.seq, 抽样 1/128)
#     order_start → order_end  决策点 → 决策块末尾(send/被拒都是终点, 成对无残留)。
#
# 配对模式: 级别1/3 用 seq(同线程顺序配对), 级别2/4 用 key(跨线程/事件级归组)。
# 复用: 探针代码在 core/prof/lensx_probe.{h,cpp}, 测量脚本 scripts/measure_lensx.sh。
target:
  process: trader

output:
  csv: /tmp/trader_lensx.csv

probes:
  # 级别1 包级(无 key, seq 模式)
  - name: recv_pkt
    type: uprobe
    symbol: lensx::mark_recv_pkt
    stage: 0
  - name: unpack
    type: uprobe
    symbol: lensx::mark_unpack
    stage: 1
  # 级别2 消息级(key = 消息 seq, 抽样): alloc→pop 拆 4 段
  - name: alloc
    type: uprobe
    symbol: lensx::mark_alloc
    stage: 2
    key: arg1
  - name: push_ring
    type: uprobe
    symbol: lensx::mark_push_ring
    stage: 3
    key: arg1
  - name: parse_done
    type: uprobe
    symbol: lensx::mark_parse_done
    stage: 4
    key: arg1
  - name: dispatch
    type: uprobe
    symbol: lensx::mark_dispatch
    stage: 5
    key: arg1
  - name: retry_in
    type: uprobe
    symbol: lensx::mark_retry_in
    stage: 6
    key: arg1
  - name: retry_out
    type: uprobe
    symbol: lensx::mark_retry_out
    stage: 7
    key: arg1
  - name: pop
    type: uprobe
    symbol: lensx::mark_pop
    stage: 8
    key: arg1
  - name: process
    type: uprobe
    symbol: lensx::mark_process
    stage: 9
    key: arg1
  # 级别3 仲裁(seq 模式, 无 key)
  - name: arb_start
    type: uprobe
    symbol: lensx::mark_arb_start
    stage: 10
  - name: arb_end
    type: uprobe
    symbol: lensx::mark_arb_end
    stage: 11
  # 级别4 下单决策→执行完毕(key 模式, key = sig_ofi.seq)
  - name: order_start
    type: uprobe
    symbol: lensx::mark_order_start
    stage: 12
    key: arg1
  - name: order_end
    type: uprobe
    symbol: lensx::mark_order_end
    stage: 13
    key: arg1

matchers:
  # 级别1: recv_th 内部 包到达→拆包(同线程 seq 配对)
  - id: recv_to_unpack
    stages: [0, 1]
    mode: seq
  # 级别2 细化: alloc→process 拆 5 段(跨线程 key 配对, 每段成对无残留)
  # 主链路: alloc→push_ring→parse_done→dispatch→pop→process
  # retry 路径(慢消费者隔离): dispatch→retry_in→retry_out→pop(独立配对)
  - id: alloc_to_push_ring
    stages: [2, 3]
    mode: key
  - id: push_ring_to_parse
    stages: [3, 4]
    mode: key
  - id: parse_to_dispatch
    stages: [4, 5]
    mode: key
  - id: dispatch_to_pop
    stages: [5, 8]
    mode: key
  - id: pop_to_process
    stages: [8, 9]
    mode: key
  - id: alloc_to_pop
    stages: [2, 3, 4, 5, 8]
    mode: key
  - id: alloc_to_process
    stages: [2, 3, 4, 5, 8, 9]
    mode: key
  # retry 桶路径(慢消费者隔离触发时, 抽样事件进桶)
  - id: dispatch_to_retry_in
    stages: [5, 6]
    mode: key
  - id: retry_in_to_retry_out
    stages: [6, 7]
    mode: key
  - id: retry_out_to_pop
    stages: [7, 8]
    mode: key
  - id: retry_to_pop
    stages: [6, 7, 8]
    mode: key
  # 级别3: 仲裁函数完整执行(同线程 seq 配对)
  - id: arb_to_end
    stages: [10, 11]
    mode: seq
  # 级别4: 下单决策→执行完毕(同线程 key 配对, send/被拒都是终点)
  - id: order_to_end
    stages: [12, 13]
    mode: key

reports:
  - name: recv_to_unpack
    from: 0
    to: 1
  - name: alloc_to_push_ring
    from: 2
    to: 3
  - name: push_ring_to_parse
    from: 3
    to: 4
  - name: parse_to_dispatch
    from: 4
    to: 5
  - name: dispatch_to_pop
    from: 5
    to: 8
  - name: pop_to_process
    from: 8
    to: 9
  - name: alloc_to_pop
    from: 2
    to: 8
  - name: alloc_to_process
    from: 2
    to: 9
  - name: dispatch_to_retry_in
    from: 5
    to: 6
  - name: retry_in_to_retry_out
    from: 6
    to: 7
  - name: retry_out_to_pop
    from: 7
    to: 8
  - name: retry_to_pop
    from: 6
    to: 8
  - name: arb_to_end
    from: 10
    to: 11
  - name: order_to_end
    from: 12
    to: 13
